<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16264A">
<title>Rimsa Denim Terminal</title>
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#14203A;--mute:#5B6780;--denim:#16264A;--blue:#2F5D9E;--stitch:#E0A23B;--line:#CBD3E1;--err:#B3402F;--ok:#2E7D4F;--inp:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1526;--card:#16213A;--ink:#E8EDF7;--mute:#97A3BD;--line:#2A3858;--inp:#0F1830;--blue:#6F9BDB;--err:#E37A68;--ok:#5CC089}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--denim);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px dashed var(--stitch)}
header h1{font-size:17px;margin:0;flex:1;font-weight:700}
header button{background:none;border:1px solid #fff5;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--stitch);outline-offset:1px}
.btn{width:100%;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--err)}
.row{display:flex;gap:10px}.row>*{flex:1}
.menu .btn{padding:26px 14px;font-size:20px;background:var(--denim);color:#fff;border-bottom:4px solid var(--stitch)}
.back{background:none;border:0;color:var(--blue);font-size:16px;padding:4px 0 10px;font-weight:600}
.info{display:flex;justify-content:space-between;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--line)}
.info b{text-align:right}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600;font-size:13px}
tr.sel td{background:color-mix(in srgb,var(--stitch) 30%,transparent)}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:999px;padding:6px 10px;font-size:13px}
.hint{font-size:13px;color:var(--mute)}
.total{font-size:15px;color:var(--mute);margin:0 0 6px}.total b{font-size:22px;color:var(--ink)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:14px;border-radius:10px;color:#fff;font-weight:600;display:none;z-index:9;text-align:center}
#toast.err{background:var(--err)}#toast.ok{background:var(--ok)}
dialog{border:0;border-radius:14px;padding:18px;max-width:340px;width:90%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.bar{display:flex;gap:8px}.bar input{flex:1;min-width:0}
.cam{flex:0 0 58px;border:2px solid var(--line);background:var(--inp);border-radius:10px;font-size:24px}
#scan{padding:0;overflow:hidden;max-width:420px}
#cv{width:100%;display:block;max-height:62vh;object-fit:cover;background:#000}
#scan p{margin:0;padding:12px 14px 0;color:var(--mute);font-size:14px}
#scan .btn{margin:12px 14px 14px;width:calc(100% - 28px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 id="ttl">Rimsa Denim Terminal</h1><button id="out" hidden>Çıkış</button></header>
<main>

<section id="giris" class="card">
  <label for="kul">Kullanıcı kodu</label>
  <select id="kul"><option>AHMET</option><option>MEHMET</option><option>AYSE</option></select>
  <label for="sif">Şifre</label>
  <input id="sif" type="password" placeholder="Prototipte herhangi bir şifre">
  <button class="btn" id="btnGiris">Giriş</button>
  <p class="hint">Prototip: veriler örnektir, gerçek sunucuya bağlanmaz.</p>
</section>

<section id="menu" class="menu" hidden>
  <button class="btn" data-go="depo">Depolar arası aktarım</button>
  <button class="btn" data-go="raf">Raf aktarım</button>
</section>

<section id="depo" hidden>
  <button class="back" data-go="menu">‹ Menü</button>
  <div class="card">
    <label for="dHedef">Aktarılacak depo</label>
    <select id="dHedef"></select>
    <label for="dRaf">Raf adı</label>
    <input id="dRaf" autocomplete="off" placeholder="Örn. TD-B1">
    <label for="dBar">Barkod</label>
    <div class="bar"><input id="dBar" autocomplete="off" inputmode="text" placeholder="Barkodu okutun"><button class="cam" id="dCam" type="button" aria-label="Kamerayla oku">📷</button></div>
    <div class="chips" id="dChips"></div>
    <button class="btn" id="dKaydet">Kaydet</button>
  </div>
  <div class="card">
    <p class="total">Aktarım miktarı <b id="dAdet">0</b></p>
    <div class="scroll"><table><thead><tr><th>Barkod</th><th>Ürün</th><th>Nereden</th><th>Nereye</th></tr></thead><tbody id="dList"></tbody></table></div>
    <div class="row">
      <button class="btn alt" id="dSil">Seçiliyi sil</button>
      <button class="btn" id="dSon">Sonlandır</button>
    </div>
  </div>
</section>

<section id="raf" hidden>
  <button class="back" data-go="menu">‹ Menü</button>
  <div class="card">
    <label for="rDepo">Depo</label>
    <select id="rDepo"></select>
    <label for="rRaf">Yeni raf</label>
    <select id="rRaf"></select>
    <label for="rBar">Barkod</label>
    <div class="bar"><input id="rBar" autocomplete="off" placeholder="Barkodu okutun, Enter"><button class="cam" id="rCam" type="button" aria-label="Kamerayla oku">📷</button></div>
    <div class="chips" id="rChips"></div>
    <div class="info" style="margin-top:10px"><span>Ürün</span><b id="rUrun">-</b></div>
    <div class="info"><span>Eski raf</span><b id="rEski">-</b></div>
    <button class="btn" id="rKaydet">Kaydet</button>
  </div>
  <div class="card"><p class="total">Son raf değişiklikleri</p>
    <div class="scroll"><table><tbody id="rLog"></tbody></table></div></div>
</section>
</main>

<div id="toast" role="status"></div>
<dialog id="dlg"><p id="dlgTxt"></p><div class="row"><button class="btn alt" id="dlgNo">Hayır</button><button class="btn" id="dlgYes">Evet</button></div></dialog>

<dialog id="scan"><video id="cv" playsinline muted></video><p>Barkodu kameranın önüne tutun, otomatik okunur.</p><button class="btn alt" id="scanX" type="button">Kapat</button></dialog>

<script>
(function(){
var DEPOLAR={"Ham Depo":{"HD-A1":1,"HD-A2":1,"HD-A3":0},"Terbiye Depo":{"TD-B1":1,"TD-B2":1},"Mamul Depo":{"MD-C1":1,"MD-C2":1},"Sevkiyat Depo":{"SV-01":1}};
var URUN={
"RD1001":{ad:"Denim 12oz Indigo",depo:"Ham Depo",raf:"HD-A1"},
"RD1002":{ad:"Denim 10oz Black",depo:"Ham Depo",raf:"HD-A2"},
"RD1003":{ad:"Stretch 9oz",depo:"Terbiye Depo",raf:"TD-B1"},
"RD1004":{ad:"Denim 14oz Raw",depo:"Terbiye Depo",raf:"TD-B2"},
"RD1005":{ad:"Denim 11oz Grey",depo:"Mamul Depo",raf:"MD-C1"}};
var $=function(i){return document.getElementById(i)};
var liste=[],secili=-1,log=[],fis=1000,tt;
function toast(m,t){var e=$("toast");e.textContent=m;e.className=t||"err";e.style.display="block";clearTimeout(tt);tt=setTimeout(function(){e.style.display="none"},2600)}
function ask(m){return new Promise(function(r){var d=$("dlg");$("dlgTxt").textContent=m;d.showModal();$("dlgYes").onclick=function(){d.close();r(true)};$("dlgNo").onclick=function(){d.close();r(false)}})}
var TITLES={giris:"Rimsa Denim Terminal",menu:"Ana menü",depo:"Depolar arası aktarım",raf:"Raf aktarım"};
function go(s){["giris","menu","depo","raf"].forEach(function(k){$(k).hidden=k!==s});$("ttl").textContent=TITLES[s];$("out").hidden=s==="giris";if(s==="depo")dReset();if(s==="raf")rReset()}
document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
$("btnGiris").onclick=function(){if(!$("sif").value){toast("Kullanıcı adı ve şifre hatalı");return}go("menu")};
$("sif").onkeydown=function(e){if(e.key==="Enter")$("btnGiris").click()};
$("out").onclick=function(){ask("Programdan çıkmak istiyormusunuz ?").then(function(y){if(y){$("sif").value="";go("giris")}})};
function chips(el,target,fn){el.innerHTML="";Object.keys(URUN).forEach(function(b){var x=document.createElement("button");x.textContent=b;x.onclick=function(){target.value=b;fn&&fn()};el.appendChild(x)})}
function opts(sel,arr){sel.innerHTML="";arr.forEach(function(v){var o=document.createElement("option");o.textContent=v;sel.appendChild(o)})}

/* Depo aktarım */
function dReset(){opts($("dHedef"),["Seçiniz"].concat(Object.keys(DEPOLAR)));$("dRaf").value="";$("dBar").value="";chips($("dChips"),$("dBar"));dDraw()}
function dDraw(){var b=$("dList");b.innerHTML="";liste.forEach(function(r,i){var tr=document.createElement("tr");if(i===secili)tr.className="sel";tr.innerHTML="<td>"+r.bar+"</td><td>"+r.ad+"</td><td>"+r.depo+" / "+r.raf+"</td><td>"+r.hDepo+" / "+r.hRaf+"</td>";tr.onclick=function(){secili=i;dDraw()};b.appendChild(tr)});$("dAdet").textContent=liste.length}
function dKaydet(){
 var depo=$("dHedef").value,raf=$("dRaf").value.trim().toUpperCase(),bar=$("dBar").value.trim().toUpperCase();
 if(depo==="Seçiniz"){toast("Depo bilgisi yok");return}
 if(!bar){toast("Barkod bilgisi girilmedi !");return}
 if(!DEPOLAR[depo][raf]){toast("Raf bilgisi yanlış !!!");return}
 var u=URUN[bar];if(!u){toast("Depo bilgisi bulunamadı");return}
 if(liste.some(function(r){return r.bar===bar})){toast("Bu barkod zaten listede");return}
 liste.push({bar:bar,ad:u.ad,depo:u.depo,raf:u.raf,hDepo:depo,hRaf:raf});
 $("dBar").value="";$("dBar").focus();dDraw();toast("Kayıt başarılı","ok")}
$("dKaydet").onclick=dKaydet;$("dBar").onkeydown=function(e){if(e.key==="Enter")dKaydet()};
$("dSil").onclick=function(){if(secili<0){toast("Silinecek satırı seçin");return}ask("Kaydı silmek istiyormusunuz ?").then(function(y){if(y){liste.splice(secili,1);secili=-1;dDraw()}})};
$("dSon").onclick=function(){if(!liste.length){toast("Aktarım listesi bulunamadı !!!");return}
 ask("Aktarım işlemini sonlandırmak istiyormusunuz ?").then(function(y){if(!y)return;
  liste.forEach(function(r){URUN[r.bar].depo=r.hDepo;URUN[r.bar].raf=r.hRaf});
  var n=liste.length;liste=[];secili=-1;fis++;dDraw();toast("Aktarım tamamlandı. Fiş no: "+fis+" ("+n+" kayıt)","ok")})};

/* Raf aktarım */
function rReset(){opts($("rDepo"),Object.keys(DEPOLAR));rRafDoldur();$("rBar").value="";$("rUrun").textContent="-";$("rEski").textContent="-";chips($("rChips"),$("rBar"),rBul);rDraw()}
function rRafDoldur(){opts($("rRaf"),Object.keys(DEPOLAR[$("rDepo").value]))}
$("rDepo").onchange=rRafDoldur;
function rBul(){var b=$("rBar").value.trim().toUpperCase(),u=URUN[b];
 if(!u){$("rUrun").textContent="-";$("rEski").textContent="-";if(b)toast("Raf bilgisi bulunamadı");return null}
 $("rUrun").textContent=u.ad;$("rEski").textContent=u.depo+" / "+u.raf;return u}
$("rBar").onkeydown=function(e){if(e.key==="Enter")rBul()};
function rDraw(){$("rLog").innerHTML=log.slice(-5).reverse().map(function(l){return "<tr><td>"+l+"</td></tr>"}).join("")||"<tr><td class='hint'>Henüz kayıt yok</td></tr>"}
$("rKaydet").onclick=function(){var b=$("rBar").value.trim().toUpperCase();
 if(!b){toast("Barkod bilgisi girilmedi !");return}
 var u=rBul();if(!u)return;
 var d=$("rDepo").value,r=$("rRaf").value;
 if(!DEPOLAR[d][r]){toast("KAPALI !");return}
 var eski=u.depo+" / "+u.raf;u.depo=d;u.raf=r;
 log.push(b+": "+eski+" → "+d+" / "+r);$("rEski").textContent=d+" / "+r;rDraw();toast("Kayıt başarılı","ok");$("rBar").value="";$("rBar").focus()};
/* Kamera ile barkod okuma */
var scanStream=null,scanTimer=null,scanDone=null;
function scanStop(){clearInterval(scanTimer);if(scanStream){scanStream.getTracks().forEach(function(t){t.stop()});scanStream=null}$("cv").srcObject=null;if($("scan").open)$("scan").close()}
window.onNativeScan=function(v){if(scanDone){var f=scanDone;scanDone=null;f(String(v).trim())}};
function scanBarcode(done){
 if(window.Android&&window.Android.scan){scanDone=done;window.Android.scan();return}
 if(!("BarcodeDetector" in window)||!navigator.mediaDevices){toast("Bu tarayıcı kamerayla barkod okumayı desteklemiyor. Android’de Chrome kullanın.");return}
 var det=new BarcodeDetector();
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(s){
  scanStream=s;var v=$("cv");v.srcObject=s;v.play();$("scan").showModal();
  scanTimer=setInterval(function(){if(v.readyState<2)return;det.detect(v).then(function(r){if(r.length){var val=String(r[0].rawValue).trim();scanStop();if(navigator.vibrate)navigator.vibrate(80);done(val)}}).catch(function(){})},250)
 }).catch(function(){toast("Kamera açılamadı. Kamera iznini kontrol edin.")})}
$("scanX").onclick=scanStop;$("scan").addEventListener("cancel",scanStop);
$("dCam").onclick=function(){scanBarcode(function(v){$("dBar").value=v;dKaydet()})};
$("rCam").onclick=function(){scanBarcode(function(v){$("rBar").value=v;rBul()})};
go("giris");
})();
</script>
</body>
</html>
